name: Idea
description: Una misura che manca, un avviso utile, un modo migliore di mostrare qualcosa. A missing reading, a useful alert, a better way to show something.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea / The idea
      description: Cosa vorresti e perché ti servirebbe. What you'd like and why it would help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS, Mac
      description: Compilato dall'app. Filled in by the app.
